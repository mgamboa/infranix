[project]
name = "infranix"
version = "0.1.0"
description = "Declarative Infrastructure Orchestrator (Terraform + Ansible + govc)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "click>=8.0",
    "PyYAML>=6.0",
    "tabulate>=0.9",
]

[project.scripts]
infra = "infranix.cli:cli"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["infranix*"]
