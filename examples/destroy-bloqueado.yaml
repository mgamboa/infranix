# Demonstrates Safety Gate blocking destruction without explicit opt-in.
# No real IPs/hosts here — hypervisor comes from ${INFRA_*}. vars.
version: 1
project: demo-destroy
hypervisor: ${INFRA_HYPERVISOR}

safety:
  destroy: false          # <-- blocks all destruction
  allow_downtime: false

servers:
  - name: ${TARGET_VM}
    image: ${TARGET_IMAGE}
    cpu: 4
    mem: 8192
    disk: 20
    roles: []
    action: destroy       # attempt to destroy -> must be blocked