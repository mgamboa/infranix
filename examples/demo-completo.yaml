# Demo: all manifest sections with dynamic ${VAR} values.
# Vars resolve at runtime from the environment or ~/.infranix/.env.
version: 1
project: demo-completo
hypervisor: ${INFRA_HYPERVISOR}

safety:
  destroy: false
  allow_downtime: false

images:
  - name: rockylinux-9
    distro: rocky
    version: "${ROCKY_VERSION}"
    build:
      builder: packer
  - name: rhel-8
    distro: rhel
    version: "${RHEL8_VERSION}"

networks:
  - name: ${INFRA_NETWORK}
    type: portgroup
    subnet: ${SUBNET}
    gateway: ${GATEWAY}

servers:
  - name: web-prod-01
    image: rockylinux-9
    cpu: 4
    mem: 8192
    disk: 60
    network:
      - { name: ${INFRA_NETWORK}, ip: ${WEB1_IP}, gateway: ${GATEWAY}, dns: [${DNS}] }
    roles: [webserver, monitoring-agent]
    action: create

  - name: web-prod-02
    image: rockylinux-9
    cpu: 4
    mem: 8192
    disk: 60
    network:
      - { name: ${INFRA_NETWORK}, ip: ${WEB2_IP}, gateway: ${GATEWAY}, dns: [${DNS}] }
    roles: [webserver, monitoring-agent]
    action: create

routers:
  - name: edge-router
    image: rhel-8
    interfaces:
      - { network: ${INFRA_NETWORK}, ip: ${ROUTER_IP} }
    nat: true

load_balancers:
  - name: lb-web
    type: haproxy
    listeners:
      - { port: 443, protocol: https, backend: [web-prod-01, web-prod-02], health: /healthz }