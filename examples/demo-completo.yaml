# Manifiesto de demostración de todas las secciones del manual.
# Incluye: images, networks, servers (create/update/destroy),
#          routers y load_balancers. Solo demuestra el parseo/plan.
version: 1
project: demo-completo
hypervisor: esxi

safety:
  destroy: false
  allow_downtime: false

images:
  - name: rockylinux-9
    distro: rocky
    version: "9.5"
  - name: rhel-8
    distro: rhel
    version: "8.9"

networks:
  - name: VM Network
    type: portgroup
    subnet: 192.168.2.0/24
    gateway: 192.168.2.1

servers:
  - name: web-prod-01
    image: rockylinux-9
    cpu: 4
    mem: 8192
    disk: 60
    network:
      - { name: VM Network, ip: 192.168.2.160/24, gateway: 192.168.2.1, dns: [192.168.2.1] }
    roles: [webserver, monitoring-agent]
    action: create

  - name: web-prod-02
    image: rockylinux-9
    cpu: 4
    mem: 8192
    disk: 60
    network:
      - { name: VM Network, ip: 192.168.2.161/24, gateway: 192.168.2.1, dns: [192.168.2.1] }
    roles: [webserver, monitoring-agent]
    action: create

routers:
  - name: edge-router
    image: rhel-8
    interfaces:
      - { network: VM Network, ip: 192.168.2.254 }
    nat: true

load_balancers:
  - name: lb-web
    type: haproxy
    listeners:
      - { port: 443, protocol: https, backend: [web-prod-01, web-prod-02], health: /healthz }
