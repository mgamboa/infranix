# Manifiesto de ejemplo — despliegue seguro de una VM nueva
# NO toca ninguna infraestructura existente. Solo crea web-prod-01.
version: 1
project: infranix-poc
hypervisor: esxi

scan_before_apply: true
safety:
  destroy: false
  allow_downtime: false

images:
  - { name: rhel-9.5, distro: rhel, version: "9.5" }

networks:
  - name: VM Network
    type: portgroup
    subnet: 192.168.2.0/24
    gateway: 192.168.2.1

servers:
  - name: web-prod-01
    image: rhel-9.5
    cpu: 2
    mem: 4096
    disk: 40
    network:
      - { name: "VM Network", ip: 192.168.2.150/24, gateway: 192.168.2.1, dns: [192.168.2.1] }
    roles: [webserver]
    action: create
