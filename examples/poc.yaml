# Example: deploy a single VM declared with dynamic ${VAR} values.
# ${VAR}s resolve at runtime from the environment or ~/.infranix/.env
# (see docs/MANUAL.md, Variables section).
version: 1
project: infranix-poc
hypervisor: ${INFRA_HYPERVISOR}

scan_before_apply: true
safety:
  destroy: false
  allow_downtime: false

images:
  - name: rhel-9.5
    distro: rhel
    version: "9.5"

networks:
  - name: ${INFRA_NETWORK}
    type: portgroup
    subnet: ${POC_SUBNET}
    gateway: ${POC_GATEWAY}

servers:
  - name: web-prod-01
    image: rhel-9.5
    cpu: 2
    mem: 4096
    disk: 40
    network:
      - name: ${INFRA_NETWORK}
        ip: ${POC_IP}
        gateway: ${POC_GATEWAY}
        dns: ['${POC_DNS}']
    roles: [webserver]
    action: create