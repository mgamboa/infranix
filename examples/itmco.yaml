# Example manifest for an existing environment, declared with ${VAR} dynamic values.
# Real hosts/IPs are NEVER hardcoded here; they come from the environment or
# ~/.infranix/.env at runtime. See docs/MANUAL.md (Variables section).
version: 1
project: ${PROJECT_NAME}
hypervisor: ${INFRA_HYPERVISOR}

scan_before_apply: true

# SAFETY: keep destroy:false to protect existing infrastructure
safety:
  destroy: false
  allow_downtime: false
  confirm_destructive: true

images:
  - name: rhel-9.5
    distro: rhel
    version: "9.5"
    source:
      type: template
  - name: rocky-10.2
    distro: rocky
    version: "10.2"
    source:
      type: template

networks:
  - name: '${INFRA_NETWORK}'
    type: portgroup
    subnet: '${SUBNET}'
    gateway: '${GATEWAY}'

servers:
  - name: web-prod-01
    image: rhel-9.5
    cpu: 4
    mem: 8192
    disk: 60
    network:
      - name: '${INFRA_NETWORK}'
        ip: '${WEB_IP}'
        gateway: '${GATEWAY}'
        dns: ['${DNS}']
    roles: [webserver]
    action: create

  # Recognizes an existing VM (would only update it)
  - name: ${EXISTING_SERVER_A}
    image: rhel-9.5
    cpu: 8
    mem: 16384
    disk: 100
    roles: [wazuh-server]
    action: update

  # SAFETY DEMO: attempts to destroy an existing VM without safety.destroy:true.
  # The Safety Gate MUST block this.
  - name: ${EXISTING_SERVER_B}
    image: rhel-9.5
    cpu: 4
    mem: 8192
    disk: 20
    roles: []
    action: destroy     # forces a block because safety.destroy=false